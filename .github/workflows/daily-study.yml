name: "Daily Study Notes"

on:
  schedule:
    - cron: '0 20 * * *'  # 매일 오전 5:00 KST
  workflow_dispatch:

jobs:
  generate-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai==1.82.0

      - name: Generate CS 기초 note
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate.py topics_cs.json

      - name: Generate 백엔드+클라우드 note
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate.py topics_backend.json

      - name: Generate 자료구조/알고리즘 note
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate.py topics_algo.json

      - name: Commit and push notes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "CS 기초 지식/" "백엔드 + 클라우드/" "자료구조 및 알고리즘/" topics_cs.json topics_backend.json topics_algo.json
          git diff --cached --quiet || git commit -m "📚 Daily Study: $(TZ='Asia/Seoul' date '+%Y-%m-%d')"
          git push
