name: "Daily 백엔드 + 클라우드"

on:
  schedule:
    - cron: '10 20 * * *'  # 매일 오전 5:10 KST
  workflow_dispatch:

jobs:
  generate-note:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest changes
        run: git pull --rebase origin master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai==1.82.0

      - name: Generate today's backend note
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate.py topics_backend.json

      - name: Commit and push note
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/backend/ topics_backend.json
          git diff --cached --quiet || git commit -m "📚 백엔드+클라우드: $(TZ='Asia/Seoul' date '+%Y-%m-%d')"
          git pull --rebase origin master
          git push
