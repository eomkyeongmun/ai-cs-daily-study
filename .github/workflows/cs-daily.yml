name: "Daily CS 기초 지식"

on:
  schedule:
    - cron: '0 20 * * *'  # 매일 오전 5:00 KST
  workflow_dispatch:

jobs:
  generate-note:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai==1.82.0

      - name: Generate today's CS note
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate.py topics_cs.json

      - name: Commit and push note
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "CS 기초 지식/" topics_cs.json
          git diff --cached --quiet || git commit -m "📚 CS 기초: $(TZ='Asia/Seoul' date '+%Y-%m-%d')"
          git push
